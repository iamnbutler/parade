<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Laid paper: fine laid lines, wide chain lines, speckle and fibres. Tiles seamlessly. -->
  <filter id="speck" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" seed="7"/>
    <feColorMatrix values="0 0 0 0 0.93  0 0 0 0 0.88  0 0 0 0 0.76  0 0 0 -2.2 1.32"/>
  </filter>
  <filter id="fibre" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="turbulence" baseFrequency="0.012 0.32" numOctaves="2" stitchTiles="stitch" seed="3"/>
    <feColorMatrix values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.72  0 0 0 -3 1.7"/>
  </filter>
  <pattern id="laid" width="256" height="3" patternUnits="userSpaceOnUse">
    <rect y="0" width="256" height="1" fill="#000" fill-opacity=".05"/>
    <rect y="1" width="256" height="1" fill="#fff" fill-opacity=".012"/>
  </pattern>
  <rect width="256" height="256" fill="url(#laid)"/>
  <rect x="63" width="1.2" height="256" fill="#000" fill-opacity=".09"/>
  <rect x="64.2" width="1" height="256" fill="#fff" fill-opacity=".018"/>
  <rect x="191" width="1.2" height="256" fill="#000" fill-opacity=".09"/>
  <rect x="192.2" width="1" height="256" fill="#fff" fill-opacity=".018"/>
  <rect width="256" height="256" filter="url(#speck)" opacity=".13"/>
  <rect width="256" height="256" filter="url(#fibre)" opacity=".022"/>
</svg>
