name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build Release app
        env:
          DEVID_P12_B64: ${{ secrets.DEVID_P12_B64 }}
          DEVID_P12_PASSWORD: ${{ secrets.DEVID_P12_PASSWORD }}
          DEVID_PROFILE_B64: ${{ secrets.DEVID_PROFILE_B64 }}
          DEV_P12_B64: ${{ secrets.DEV_P12_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "$DEVID_P12_B64" ] && [ -n "$ASC_KEY_ID" ]; then
            # Developer ID signing. The iCloud entitlement needs a
            # provisioning profile, so: archive with cloud-managed automatic
            # signing (API key), then export re-signs with the Developer ID
            # cert imported into a throwaway keychain and a profile fetched
            # on the fly.
            security create-keychain -p ci build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p ci build.keychain
            printf '%s' "$DEVID_P12_B64" | base64 -d > cert.p12
            security import cert.p12 -k build.keychain -P "$DEVID_P12_PASSWORD" -T /usr/bin/codesign
            rm cert.p12
            # Resident Apple Development identity, so the archive step reuses
            # it instead of minting a throwaway cert per run (the account cert
            # cap turns that into a hard failure eventually).
            if [ -n "$DEV_P12_B64" ]; then
              printf '%s' "$DEV_P12_B64" | base64 -d > dev.p12
              security import dev.p12 -k build.keychain -P "$DEVID_P12_PASSWORD" -T /usr/bin/codesign
              rm dev.p12
            fi
            security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain > /dev/null
            mkdir -p "$HOME/private_keys"
            printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
            AUTH=(-allowProvisioningUpdates \
              -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID")
            xcodebuild -project Parade.xcodeproj -scheme Parade \
              -destination 'generic/platform=macOS' -configuration Release \
              -derivedDataPath build -archivePath dist/Parade.xcarchive \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
              ENABLE_HARDENED_RUNTIME=YES \
              DEVELOPMENT_TEAM=8S43JJMN6B \
              "${AUTH[@]}" \
              archive
            # Export signs manually: API keys aren't allowed to mint
            # Developer ID profiles on the fly ("Cloud signing permission
            # error"), so a pre-made profile ships in as a secret.
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            printf '%s' "$DEVID_PROFILE_B64" | base64 -d \
              > "$HOME/Library/MobileDevice/Provisioning Profiles/parade-devid.provisionprofile"
            cat > export.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
            <key>teamID</key>
            <string>8S43JJMN6B</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.natebutler.parade</key>
              <string>Parade Developer ID</string>
            </dict>
          </dict>
          </plist>
          EOF
            xcodebuild -exportArchive -archivePath dist/Parade.xcarchive \
              -exportOptionsPlist export.plist -exportPath dist/export
            echo "APP_PATH=dist/export/Parade.app" >> "$GITHUB_ENV"
          else
            echo "::notice::DEVID_P12_B64/ASC secrets not set — building ad-hoc signed (Open Anyway install)."
            # No profile is possible here, so the iCloud entitlements must be
            # dropped — macOS kills ad-hoc apps carrying restricted
            # entitlements at launch. The app falls back to a local library.
            xcodebuild -project Parade.xcodeproj -scheme Parade \
              -destination 'generic/platform=macOS' -configuration Release \
              -derivedDataPath build \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
              CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
              CODE_SIGN_ENTITLEMENTS= \
              build
            echo "APP_PATH=build/Build/Products/Release/Parade.app" >> "$GITHUB_ENV"
          fi

      - name: Make DMG
        run: |
          mkdir -p dist/dmg
          cp -R "$APP_PATH" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Parade" -srcfolder dist/dmg -format UDZO dist/Parade.dmg

      - name: Notarize DMG
        env:
          DEVID_P12_B64: ${{ secrets.DEVID_P12_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$DEVID_P12_B64" ] || [ -z "$ASC_KEY_ID" ]; then
            echo "::notice::Skipping notarization (needs DEVID_P12_B64 + ASC_* secrets)."
            exit 0
          fi
          codesign --force --sign "Developer ID Application" --timestamp dist/Parade.dmg
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun notarytool submit dist/Parade.dmg \
            --key ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple dist/Parade.dmg

      - name: Sign update and write appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_VER=2.9.6
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VER}/Sparkle-${SPARKLE_VER}.tar.xz" -o sparkle.tar.xz
          mkdir sparkle && tar -xf sparkle.tar.xz -C sparkle
          printf '%s' "$SPARKLE_PRIVATE_KEY" > ed_key
          SIG=$(./sparkle/bin/sign_update --ed-key-file ed_key dist/Parade.dmg)
          rm ed_key
          VERSION="${GITHUB_REF_NAME#v}"
          cat > dist/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Parade</title>
              <item>
                <title>Parade ${VERSION}</title>
                <sparkle:version>${GITHUB_RUN_NUMBER}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <pubDate>$(date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <enclosure url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Parade.dmg" ${SIG} type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF
          cat dist/appcast.xml

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Release notes = this version's section of CHANGELOG.md.
          awk -v ver="$VERSION" '
            /^## / { grab = index($0, ver) > 0; next }
            grab { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" dist/Parade.dmg dist/appcast.xml \
              --title "Parade $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/Parade.dmg dist/appcast.xml \
              --title "Parade $GITHUB_REF_NAME" --generate-notes
          fi
