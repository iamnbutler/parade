name: Parade
options:
  bundleIdPrefix: com.natebutler
  createIntermediateGroups: true

packages:
  AO3Kit:
    path: AO3Kit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.0

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  Parade:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Shared]
    dependencies:
      - package: AO3Kit
      - package: Sparkle
        destinationFilters: [macOS]
    info:
      path: Shared/Info.plist
      properties:
        CFBundleDisplayName: Parade
        # XcodeGen otherwise hardcodes 1.0/1 — these must track the build
        # settings or TestFlight and Sparkle both see the wrong version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Make Documents visible in the Files app ("On My iPhone > Parade")
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # All four orientations — iPad multitasking requires the full set.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # App Store / TestFlight: HTTPS-only networking, so exempt from
        # export-compliance questions on every upload.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        # macOS: closing Books reader windows after bulk imports
        NSAppleEventsUsageDescription: Parade closes the reader windows Apple Books opens when importing books.
        # macOS: Sparkle auto-updates
        SUFeedURL: https://github.com/iamnbutler/parade/releases/latest/download/appcast.xml
        SUPublicEDKey: 2x9mwsp0yDklLf5QWUBo9Ip0tB7uLhK3/mCOUOLX4Ms=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natebutler.parade
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8S43JJMN6B
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../Frameworks"
